name: Smoke test

# Publishes the portable build and clicks through every page of NEXORA on a real Windows machine.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish portable build
        shell: pwsh
        run: ./build/publish-unpackaged.ps1 -Platform x64 -NoZip
      - name: Use a full-HD display (so the multi-column layout is exercised)
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Display resolution unchanged: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          "Screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: UI click-through test
        shell: pwsh
        env:
          NEXORA_SCREENSHOTS_TO_LOG: "1"
        run: ./build/test/ui-smoke.ps1 -Exe (Resolve-Path artifacts/portable/win-x64/NEXORA.exe) -OutDir smoke -StandardUser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke
